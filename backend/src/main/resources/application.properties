spring.config.import=optional:file:.env[.properties]

spring.application.name=jaldishop-backend
server.port=${PORT:8080}
# Empty fallback preserves Spring Boot's default bind address outside local .env.
server.address=${SERVER_ADDRESS:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Explicit CORS allowed origins. Default includes only canonical production origins.
# In local development, define CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:4200 in .env.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://negocios-jaldishop.pages.dev,https://jaldishop.net,https://www.jaldishop.net,https://jaldishop.pe,https://www.jaldishop.pe}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:false}

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=3600000

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo}

# Mercado Pago Checkout Pro
mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
mercadopago.connect-timeout-ms=${MERCADOPAGO_CONNECT_TIMEOUT_MS:5000}
mercadopago.read-timeout-ms=${MERCADOPAGO_READ_TIMEOUT_MS:10000}
mercadopago.notification-url=${MERCADOPAGO_NOTIFICATION_URL:https://api.jaldishop.com/api/v1/checkout/mercado-pago/webhook}
mercadopago.back-url-success=${MERCADOPAGO_BACK_URL_SUCCESS:https://jaldishop.com/checkout/success}
mercadopago.back-url-failure=${MERCADOPAGO_BACK_URL_FAILURE:https://jaldishop.com/checkout/failure}
mercadopago.back-url-pending=${MERCADOPAGO_BACK_URL_PENDING:https://jaldishop.com/checkout/pending}
mercadopago.checkout-mode=${MERCADOPAGO_CHECKOUT_MODE:PREFERENCES}
mercadopago.checkout-enabled=${MERCADOPAGO_CHECKOUT_ENABLED:true}
mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
mercadopago.expected-live-mode=${MERCADOPAGO_EXPECTED_LIVE_MODE:false}
mercadopago.expected-collector-id=${MERCADOPAGO_EXPECTED_COLLECTOR_ID:}


# Conciliacion autonoma de pagos (Fase 5A) - Deshabilitada por defecto
app.payment.reconciliation.enabled=${APP_PAYMENT_RECONCILIATION_ENABLED:false}
app.payment.reconciliation.grace-period-seconds=${APP_PAYMENT_RECONCILIATION_GRACE_PERIOD_SECONDS:600}
app.payment.reconciliation.batch-size=${APP_PAYMENT_RECONCILIATION_BATCH_SIZE:50}
app.payment.reconciliation.fixed-delay-ms=${APP_PAYMENT_RECONCILIATION_FIXED_DELAY_MS:60000}
app.payment.reconciliation.orders-enabled=${APP_PAYMENT_RECONCILIATION_ORDERS_ENABLED:false}
app.payment.reconciliation.orders-grace-period-seconds=${APP_PAYMENT_RECONCILIATION_ORDERS_GRACE_PERIOD_SECONDS:120}
app.payment.reconciliation.orders-batch-size=${APP_PAYMENT_RECONCILIATION_ORDERS_BATCH_SIZE:20}
app.payment.reconciliation.orders-lease-duration-seconds=${APP_PAYMENT_RECONCILIATION_ORDERS_LEASE_DURATION_SECONDS:300}

# Procesamiento autonomo de reembolsos (Fase 5B) - Deshabilitado por defecto
payments.mercadopago.refund-scheduler-enabled=${PAYMENTS_MERCADOPAGO_REFUND_SCHEDULER_ENABLED:false}
payments.mercadopago.refund-scheduler-interval-ms=${PAYMENTS_MERCADOPAGO_REFUND_SCHEDULER_INTERVAL_MS:60000}
payments.mercadopago.refund-scheduler-batch-size=${PAYMENTS_MERCADOPAGO_REFUND_SCHEDULER_BATCH_SIZE:25}

# Local single-instance fixed-window rate limits. Never trust arbitrary forwarded headers.
server.forward-headers-strategy=none
app.security.rate-limit.max-entries=${RATE_LIMIT_MAX_ENTRIES:10000}
app.security.rate-limit.authenticated-max-entries=${RATE_LIMIT_AUTHENTICATED_MAX_ENTRIES:10000}
app.security.rate-limit.reservation-create-user.limit=${RATE_LIMIT_RESERVATION_CREATE_USER_LIMIT:12}
app.security.rate-limit.reservation-create-user.window-seconds=${RATE_LIMIT_RESERVATION_CREATE_USER_WINDOW_SECONDS:60}
app.security.rate-limit.payment-create-user.limit=${RATE_LIMIT_PAYMENT_CREATE_USER_LIMIT:6}
app.security.rate-limit.payment-create-user.window-seconds=${RATE_LIMIT_PAYMENT_CREATE_USER_WINDOW_SECONDS:60}
app.security.rate-limit.payment-admin-remote-user.limit=${RATE_LIMIT_PAYMENT_ADMIN_REMOTE_USER_LIMIT:10}
app.security.rate-limit.payment-admin-remote-user.window-seconds=${RATE_LIMIT_PAYMENT_ADMIN_REMOTE_USER_WINDOW_SECONDS:60}
app.security.rate-limit.login-account.limit=${RATE_LIMIT_LOGIN_ACCOUNT_LIMIT:5}
app.security.rate-limit.login-account.window-seconds=${RATE_LIMIT_LOGIN_ACCOUNT_WINDOW_SECONDS:60}
app.security.rate-limit.login-ip.limit=${RATE_LIMIT_LOGIN_IP_LIMIT:30}
app.security.rate-limit.login-ip.window-seconds=${RATE_LIMIT_LOGIN_IP_WINDOW_SECONDS:60}
app.security.rate-limit.register-ip.limit=${RATE_LIMIT_REGISTER_IP_LIMIT:3}
app.security.rate-limit.register-ip.window-seconds=${RATE_LIMIT_REGISTER_IP_WINDOW_SECONDS:600}
app.security.rate-limit.search-ip.limit=${RATE_LIMIT_SEARCH_IP_LIMIT:60}
app.security.rate-limit.search-ip.window-seconds=${RATE_LIMIT_SEARCH_IP_WINDOW_SECONDS:60}

# Pending end-to-end ingress verification; IP policies are inactive on Render until enabled.
# Local IP policies and the login-account policy remain active.
app.security.rate-limit.render-ip-verified=${RATE_LIMIT_RENDER_IP_VERIFIED:false}

# Recovery never sends real mail without both explicit provider mode and opt-in.
app.password-reset.mail.mode=${PASSWORD_RESET_MAIL_MODE:disabled}
app.password-reset.mail.local-directory=${PASSWORD_RESET_MAIL_LOCAL_DIRECTORY:.local/password-reset-mail}
app.password-reset.mail.real-delivery-enabled=${PASSWORD_RESET_REAL_DELIVERY_ENABLED:false}
app.password-reset.mail.from=${PASSWORD_RESET_MAIL_FROM:}
app.password-reset.mail.api-key=${PASSWORD_RESET_MAIL_API_KEY:}
