name: Password Recovery Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/password-recovery.yml'

permissions:
  contents: read

concurrency:
  group: password-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  password-recovery-certification:
    name: Recovery JDBC, Flyway and real WebSocket
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jaldishop_integration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/jaldishop_integration_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      JWT_SECRET: local-ci-password-recovery-signing-key-at-least-32-bytes
      FLYWAY_VALIDATE_ON_MIGRATE: 'true'
      PASSWORD_RESET_MAIL_MODE: disabled
      PASSWORD_RESET_REAL_DELIVERY_ENABLED: 'false'
      APP_PAYMENT_RECONCILIATION_ENABLED: 'false'
      PAYMENTS_MERCADOPAGO_REFUND_SCHEDULER_ENABLED: 'false'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: jaldishop_integration_test
      PGUSER: postgres
      PGPASSWORD: postgrespassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
      - name: Run isolated critical recovery scenarios
        id: critical-tests
        continue-on-error: true
        run: >-
          bash ./mvnw -B -Dspring.config.import=
          -Dtest=PasswordRecoveryPostgresIntegrationTest,PasswordRecoveryWebSocketIntegrationTest,PasswordRecoverySecurityWebTest,PasswordRecoveryServiceTest,RequestPasswordRecoveryServiceTest,ConfiguredPasswordResetMailTest,JwtAuthenticationFilterTest,RefreshTokenServiceTest,StompAuthChannelInterceptorTest,StompDeliveryAuthorizationBrokerTest
          clean verify
      - name: Verify complete Flyway history through V27
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          assert os.environ['PGHOST'] == '127.0.0.1'
          assert os.environ['PGDATABASE'] == 'jaldishop_integration_test'
          files = sorted(Path('src/main/resources/db/migration').glob('V*__*.sql'),
                         key=lambda path: int(re.match(r'V([0-9]+)__', path.name)[1]))
          expected = [(re.match(r'V([0-9]+)__', path.name)[1], path.name, True) for path in files]
          query = '''SELECT COALESCE(json_agg(h ORDER BY installed_rank), '[]'::json)
                     FROM (SELECT installed_rank, version, script, success
                           FROM flyway_schema_history WHERE type='SQL') h'''
          raw = subprocess.check_output(['psql', '-X', '-w', '-At', '-v', 'ON_ERROR_STOP=1', '-c', query], text=True)
          history = json.loads(raw)
          actual = [(row['version'], row['script'], row['success']) for row in history]
          assert actual == expected, 'Flyway history differs from migration files'
          assert actual[-1][0] == '27', 'V27 is missing'
          print(f'PASS: {len(actual)} Flyway SQL migrations, V27 present, all successful; Flyway.validate() covered by the JDBC test.')
          PY
      - name: Require critical test cases and reject skips
        if: always()
        env:
          MAVEN_OUTCOME: ${{ steps.critical-tests.outcome }}
        run: python3 qa/password-recovery/verify-ci-reports.py target/surefire-reports --critical --maven-outcome "$MAVEN_OUTCOME"
      - name: Upload isolated certification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: password-recovery-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: error
          retention-days: 14
