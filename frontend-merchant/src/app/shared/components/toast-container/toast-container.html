<aside
  class="fixed top-5 right-4 sm:right-6 z-60 flex flex-col gap-2.5 max-w-sm w-full pointer-events-none font-sans"
  aria-live="polite"
  aria-atomic="true"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="pointer-events-auto p-4 rounded-2xl shadow-xl border backdrop-blur-md flex items-start gap-3 transition-all animate-toast-slide bg-surface-container-lowest/98"
      [class.border-primary-container/30]="toast.type === 'success'"
      [class.border-error-container/40]="toast.type === 'error'"
      [class.border-secondary-container/40]="toast.type === 'warning'"
      [class.border-outline-variant/30]="toast.type === 'info'"
    >
      <!-- Icono Contextual con Badge -->
      <div
        class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0"
        [class.bg-surface-container]="toast.type === 'success'"
        [class.text-primary-container]="toast.type === 'success'"
        [class.bg-error-container/30]="toast.type === 'error'"
        [class.text-error]="toast.type === 'error'"
        [class.bg-secondary-fixed/50]="toast.type === 'warning'"
        [class.text-secondary]="toast.type === 'warning'"
        [class.bg-surface-container-high]="toast.type === 'info'"
        [class.text-on-surface-variant]="toast.type === 'info'"
      >
        @switch (toast.type) {
          @case ('success') {
            <ng-icon name="matCheckCircleOutline" class="text-[20px]" />
          }
          @case ('error') {
            <ng-icon name="matErrorOutline" class="text-[20px]" />
          }
          @case ('warning') {
            <ng-icon name="matWarningOutline" class="text-[20px]" />
          }
          @default {
            <ng-icon name="matInfoOutline" class="text-[20px]" />
          }
        }
      </div>

      <!-- Contenido de Texto -->
      <div class="flex flex-col min-w-0 flex-1 pt-0.5">
        @if (toast.title) {
          <span class="text-xs font-bold text-on-surface leading-tight">
            {{ toast.title }}
          </span>
        }
        <p class="text-xs text-on-surface-variant leading-relaxed mt-0.5">
          {{ toast.message }}
        </p>
      </div>

      <!-- Botón Cerrar -->
      <button
        type="button"
        (click)="dismiss(toast.id)"
        class="p-1 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer shrink-0 -mr-1 -mt-1"
        aria-label="Cerrar notificación"
      >
        <ng-icon name="matCloseOutline" class="text-[18px]" />
      </button>
    </div>
  }
</aside>
