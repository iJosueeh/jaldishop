@if (isOpen()) {
  <!-- Backdrop -->
  <div
    class="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4 overflow-y-auto"
    [class.animate-fade-in]="!isClosing()"
    [class.animate-fade-out]="isClosing()"
    (click)="handleClose()"
  >
    <!-- Contenedor Modal -->
    <div
      class="relative w-full max-w-md bg-surface-container-lowest rounded-3xl shadow-2xl border border-outline-variant/40 flex flex-col max-h-[90vh] overflow-hidden"
      [class.animate-scale-up]="!isClosing()"
      [class.modal-dialog-exit]="isClosing()"
      (click)="$event.stopPropagation()"
    >
      <!-- Cabecera -->
      <div class="px-5 py-4 border-b border-outline-variant/20 flex items-center justify-between shrink-0 bg-surface-container-low/50">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center text-primary">
            <ng-icon name="matReceiptLongOutline" class="text-xl" />
          </div>
          <div>
            <h3 class="text-sm font-extrabold text-on-surface">Ticket de Venta / Boleta</h3>
            <p class="text-[11px] text-on-surface-variant">Comprobante de compra e impresión térmica</p>
          </div>
        </div>

        <button
          type="button"
          (click)="handleClose()"
          class="p-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer btn-press focus-ring"
          aria-label="Cerrar modal"
        >
          <ng-icon name="matCloseOutline" class="text-lg" />
        </button>
      </div>

      <!-- Selector de Ancho Térmico -->
      <div class="px-5 py-2.5 bg-surface-container-low/30 border-b border-outline-variant/20 flex items-center justify-between gap-3 shrink-0">
        <span class="text-xs font-bold text-on-surface">Ancho de papel:</span>
        <div class="flex items-center gap-1.5 bg-surface-container rounded-xl p-1 border border-outline-variant/30">
          <button
            type="button"
            (click)="setPaperWidth(80)"
            [class.bg-surface-container-lowest]="paperWidth() === 80"
            [class.text-primary]="paperWidth() === 80"
            [class.font-extrabold]="paperWidth() === 80"
            [class.shadow-2xs]="paperWidth() === 80"
            class="px-3 py-1 rounded-lg text-xs font-medium text-on-surface-variant hover:text-on-surface transition-all cursor-pointer"
          >
            80 mm (42 col)
          </button>
          <button
            type="button"
            (click)="setPaperWidth(58)"
            [class.bg-surface-container-lowest]="paperWidth() === 58"
            [class.text-primary]="paperWidth() === 58"
            [class.font-extrabold]="paperWidth() === 58"
            [class.shadow-2xs]="paperWidth() === 58"
            class="px-3 py-1 rounded-lg text-xs font-medium text-on-surface-variant hover:text-on-surface transition-all cursor-pointer"
          >
            58 mm (32 col)
          </button>
        </div>
      </div>

      <!-- Visor de Ticket Térmico ASCII -->
      <div class="p-3 sm:p-5 flex-1 overflow-y-auto bg-stone-900/90 flex flex-col items-center justify-start">
        <div
          class="w-fit bg-stone-50 text-stone-900 border border-stone-300 rounded-xl shadow-xl px-3 sm:px-4 py-3 sm:py-4 overflow-x-auto transition-all duration-200"
          [class.max-w-[340px]]="paperWidth() === 80"
          [class.max-w-[270px]]="paperWidth() === 58"
        >
          <pre class="font-mono text-xs leading-[1.3] whitespace-pre select-all text-left m-0 inline-block w-fit">{{ asciiContent() }}</pre>
        </div>
      </div>

      <!-- Barra de Acciones -->
      <div class="px-5 py-3.5 border-t border-outline-variant/20 bg-surface-container-low/50 flex items-center justify-end gap-2 shrink-0">
        <button
          type="button"
          (click)="handleClose()"
          class="px-4 py-2 rounded-xl text-xs font-bold text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer"
        >
          Cerrar
        </button>
        <button
          type="button"
          (click)="printTicket()"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-primary text-white hover:bg-primary-container text-xs font-extrabold transition-all cursor-pointer shadow-md hover:shadow-lg active:scale-98"
        >
          <ng-icon name="matPrintOutline" class="text-base" />
          <span>Imprimir Boleta / Ticket</span>
        </button>
      </div>
    </div>
  </div>
}
