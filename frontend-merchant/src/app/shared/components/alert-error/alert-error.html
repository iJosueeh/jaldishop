@if (message()) {
<div role="alert" class="p-3.5 text-xs rounded-xl bg-red-50 text-red-700 border border-red-200 flex items-center gap-2.5 animate-in fade-in duration-200">
    <ng-icon name="matErrorOutline" class="text-lg text-red-600 shrink-0" />
    <span class="font-medium">{{ message() }}</span>
</div>
}
