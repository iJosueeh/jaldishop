<header class="w-full">
  <div class="flex items-center justify-between">
    <!-- Izquierda: Botón Volver (Pasos 2 y 3) o Título inicial (Paso 1) -->
    @if (currentStep() > 1) {
      <button
        type="button"
        (click)="back.emit()"
        class="inline-flex items-center gap-2 text-xs font-semibold text-stone-600 hover:text-jade-700 transition-colors cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M10 19l-7-7m0 0l7-7m-7 7h18"
          ></path>
        </svg>
        {{ previousStepLabel() }}
      </button>
    } @else {
      <div class="flex items-center gap-2">
        <span class="text-xs font-bold tracking-wider uppercase text-jade-700">Paso 1 de 3</span>
        <span class="text-stone-400 text-xs">·</span>
        <span class="text-xs font-semibold text-stone-600 tracking-wide">Datos de la cuenta</span>
      </div>
    }

    <!-- Derecha: Indicador de avance -->
    @if (currentStep() === 1) {
      <span
        class="px-2.5 py-0.5 rounded-full bg-[#f2e9d2] text-stone-700 font-bold text-[10px] tracking-wider uppercase"
      >
        Paso 1 de 3
      </span>
    } @else if (currentStep() === 2) {
      <span class="text-xs font-bold tracking-wider text-emerald-800 uppercase">
        PASO 2 DE 3 · TU NEGOCIO
      </span>
    } @else if (currentStep() === 3) {
      <div class="flex items-center gap-2 text-stone-500 text-[11px] font-medium">
        <span class="text-jade-700 font-bold">1. Cuenta ✓</span>
        <span>·</span>
        <span class="text-jade-700 font-bold">2. Negocio ✓</span>
        <span>·</span>
        <span class="font-bold text-emerald-800 tracking-wider">PASO 3 DE 3 · CAPACIDAD</span>
      </div>
    }
  </div>

  <!-- Barra de Progreso Reactiva -->
  <div class="mt-3 w-full bg-[#dfdacb] h-1.5 rounded-full overflow-hidden">
    <div
      class="bg-jade-700 h-full rounded-full transition-all duration-500"
      [class]="progressWidth()"
    ></div>
  </div>
</header>
