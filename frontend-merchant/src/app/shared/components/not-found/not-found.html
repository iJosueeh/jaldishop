<main
  class="min-h-screen w-full bg-warmCream text-stone-900 flex flex-col justify-between p-6 sm:p-10 lg:p-14 font-sans antialiased overflow-y-auto"
>
  <!-- Encabezado con Logotipo de JaldiShop -->
  <header class="w-full max-w-5xl mx-auto flex items-center justify-between">
    <a routerLink="/login" class="flex items-center gap-3 group transition-transform active:scale-95">
      <div
        class="w-10 h-10 rounded-xl bg-jade-700 flex items-center justify-center text-white shadow-md shadow-jade-700/20 group-hover:bg-jade-800 transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"
          ></path>
        </svg>
      </div>
      <div>
        <span class="font-black text-xl tracking-tight text-stone-900 block leading-none">JaldiShop</span>
        <span class="text-[10px] font-bold tracking-widest text-jade-700 uppercase block mt-0.5">
          PANEL COMERCIANTE
        </span>
      </div>
    </a>

    <a
      routerLink="/login"
      class="text-xs sm:text-sm font-bold text-stone-600 hover:text-jade-700 transition-colors"
    >
      Iniciar sesión
    </a>
  </header>

  <!-- Contenido Central de Error 404 -->
  <div class="my-auto max-w-lg w-full mx-auto text-center py-10">
    <!-- Badge de Estado -->
    <div
      class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-amber-50 border border-amber-200 text-amber-900 text-xs font-semibold mb-6 shadow-2xs"
    >
      <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
      <span>Error 404 · Ruta no encontrada</span>
    </div>

    <!-- Icono Ilustrativo -->
    <div class="flex items-center justify-center mb-4">
      <div
        class="w-20 h-20 sm:w-24 sm:h-24 rounded-3xl bg-emerald-50 border border-emerald-200/80 shadow-sm flex items-center justify-center text-jade-700"
      >
        <svg class="w-10 h-10 sm:w-12 sm:h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.8"
            d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          ></path>
        </svg>
      </div>
    </div>

    <!-- Tipografía 404 Nítida y sin Solapamiento -->
    <span class="text-7xl sm:text-8xl font-black text-stone-900 tracking-tight block leading-none">
      404
    </span>

    <h1 class="text-2xl sm:text-3xl font-extrabold text-stone-900 tracking-tight mt-4">
      Página no encontrada
    </h1>
    <p class="mt-3 text-sm sm:text-base text-stone-600 leading-relaxed max-w-md mx-auto">
      La página que buscas no existe, ha sido movida o la dirección ingresada no es válida.
    </p>

    <!-- Botones de Acción -->
    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3">
      <a
        routerLink="/login"
        class="w-full sm:w-auto px-6 py-3 rounded-xl bg-jade-700 hover:bg-jade-800 active:scale-95 text-white text-sm font-bold shadow-md shadow-jade-700/20 transition-all flex items-center justify-center gap-2 cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
          ></path>
        </svg>
        <span>Ir al inicio</span>
      </a>

      <a
        routerLink="/register"
        class="w-full sm:w-auto px-6 py-3 rounded-xl bg-white hover:bg-stone-50 active:scale-95 border border-stone-300 text-stone-700 text-sm font-bold shadow-2xs transition-all flex items-center justify-center gap-2 cursor-pointer"
      >
        <span>Crear tienda MYPE</span>
      </a>
    </div>
  </div>

  <!-- Pie de Página -->
  <footer class="w-full max-w-5xl mx-auto text-center pt-8 border-t border-stone-200/80 text-xs text-stone-500">
    <p>© JaldiShop — Tu Negocio en Marcha.</p>
  </footer>
</main>
