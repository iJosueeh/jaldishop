<header
  class="fixed top-0 left-0 lg:left-60 right-0 h-16 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-30 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-outline-variant/30 font-sans transition-all"
>
  <!-- Lado Izquierdo: Botón Hamburguesa Mobile + Buscador -->
  <div class="flex items-center gap-2.5 sm:gap-3 flex-1 max-w-md">
    <!-- Botón Hamburguesa visible solo en móviles/tablets (< lg) -->
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      class="lg:hidden p-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors cursor-pointer flex items-center justify-center shrink-0"
      aria-label="Abrir menú de navegación"
    >
      <span class="material-symbols-outlined text-[24px]">menu</span>
    </button>

    <!-- Barra de Búsqueda Flexible -->
    <div
      class="flex items-center gap-2 w-full bg-surface-container-lowest px-3 py-2 rounded-xl shadow-2xs border border-outline-variant/30"
    >
      <span class="material-symbols-outlined text-on-surface-variant text-[18px]">search</span>
      <input
        class="w-full bg-transparent text-on-surface placeholder:text-on-surface-variant/70 focus:outline-none text-xs"
        placeholder="Buscar pedido o producto..."
        aria-label="Buscar pedido o producto"
        type="text"
      />
    </div>
  </div>

  <!-- Lado Derecho: Ritmo Operativo + Nuevo Pedido + Avatar -->
  <div class="flex items-center gap-2 sm:gap-4 pl-3">
    <div
      class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface border border-outline-variant/20 shrink-0"
    >
      <span class="material-symbols-outlined text-primary-container text-[18px]">pace</span>
      <span class="text-xs font-semibold">
        @if (operationRhythmMin() > 0) {
          Ritmo de hoy: {{ operationRhythmMin() }} min / pedido
        } @else {
          En operación
        }
      </span>
    </div>

    <button
      type="button"
      class="flex items-center gap-1.5 px-3 sm:px-4 py-2 rounded-xl bg-primary-container text-white text-xs font-bold hover:bg-primary transition-colors cursor-pointer shadow-xs active:scale-98 shrink-0"
    >
      <span class="material-symbols-outlined text-[18px]">add_circle</span>
      <span class="hidden sm:inline">Nuevo Pedido</span>
      <span class="sm:hidden">Nuevo</span>
    </button>

    <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white shadow-xs shrink-0">
      <span class="material-symbols-outlined text-[18px]">person</span>
    </div>
  </div>
</header>
