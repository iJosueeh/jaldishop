<header
  class="fixed top-0 left-0 lg:left-64 right-0 h-16 bg-surface/90 backdrop-blur-md shadow-[0_1px_4px_rgba(0,0,0,0.03)] z-30 flex items-center justify-between px-4 sm:px-6 lg:px-8 border-b border-outline-variant font-sans transition-all"
>
  <!-- Lado Izquierdo: Botón Hamburguesa Mobile + Buscador -->
  <div class="flex items-center gap-2.5 sm:gap-3 flex-1 max-w-md">
    <!-- Botón Hamburguesa visible solo en móviles/tablets (< lg) -->
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      class="lg:hidden p-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-bright transition-colors cursor-pointer flex items-center justify-center shrink-0 border border-transparent hover:border-outline-variant"
      aria-label="Abrir menú de navegación"
    >
      <ng-icon name="matMenuOutline" class="text-[24px]" />
    </button>

    <!-- Barra de Búsqueda Flexible -->
    <div
      class="flex items-center gap-2.5 w-full bg-surface-bright px-3.5 py-2 rounded-xl shadow-2xs border border-outline-variant focus-within:border-primary focus-within:ring-2 focus-within:ring-primary/10 transition-all"
    >
      <ng-icon name="matSearchOutline" class="text-on-surface-variant/70 text-[18px]" />
      <input
        #searchInput
        [value]="orderService.searchQuery()"
        (input)="onSearch($any($event.target).value)"
        class="w-full bg-transparent text-on-surface placeholder:text-on-surface-variant/60 focus:outline-none text-xs"
        placeholder="Buscar por cliente, #pedido o producto..."
        aria-label="Buscar pedido o producto"
        type="text"
      />
      <kbd
        (click)="searchInput.focus()"
        class="hidden sm:inline-block px-1.5 py-0.5 text-[10px] text-on-surface-variant/70 bg-surface border border-outline-variant rounded font-mono cursor-pointer hover:bg-surface-dim transition-colors"
        title="Atajo: Presiona ⌘K o Ctrl+K para buscar"
      >
        ⌘K
      </kbd>
    </div>
  </div>

  <!-- Lado Derecho: Ritmo Operativo + Nuevo Pedido + Avatar -->
  <div class="flex items-center gap-2 sm:gap-3.5 pl-3">
    <div
      class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-bright text-on-surface border border-outline-variant shadow-2xs shrink-0"
    >
      <ng-icon name="matSpeedOutline" class="text-primary text-[18px]" />
      <span class="text-xs font-semibold">
        @if ((operationRhythmMin() ?? 0) > 0) {
          Ritmo de hoy: <strong class="text-on-surface font-mono">{{ operationRhythmMin() }} min</strong> / pedido
        } @else {
          En operación continua
        }
      </span>
    </div>

    <button
      type="button"
      (click)="handleNewOrder()"
      class="flex items-center gap-1.5 px-3.5 sm:px-4 py-2 rounded-xl bg-primary hover:bg-primary-hover text-white text-xs font-bold transition-all cursor-pointer shadow-xs active:scale-98 shrink-0 shadow-primary/20"
    >
      <ng-icon name="matAddCircleOutline" class="text-[18px]" />
      <span class="hidden sm:inline">Nuevo Pedido</span>
      <span class="sm:hidden">Nuevo</span>
    </button>

    <app-context-switcher />

    <app-notification-center />

    <a
      routerLink="/profile"
      title="Mi Perfil"
      class="w-9 h-9 rounded-full bg-primary flex items-center justify-center text-white text-xs font-bold shadow-xs shrink-0 cursor-pointer ring-2 ring-primary/20 hover:ring-primary/50 transition-all"
    >
      {{ profileService.userInitials() }}
    </a>
  </div>
</header>
