<header
  class="fixed top-0 left-60 right-0 h-16 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-40 flex items-center justify-between px-6 lg:px-8 border-b border-outline-variant/30 font-sans"
>
  <!-- Barra de Búsqueda -->
  <div class="flex items-center gap-4 w-96">
    <div
      class="flex items-center gap-2 w-full bg-surface-container-lowest px-3.5 py-2 rounded-xl shadow-2xs border border-outline-variant/30"
    >
      <span class="material-symbols-outlined text-on-surface-variant text-[20px]">search</span>
      <input
        class="w-full bg-transparent text-on-surface placeholder:text-on-surface-variant/70 focus:outline-none text-xs"
        placeholder="Buscar pedido, cliente o producto..."
        type="text"
      />
    </div>
  </div>

  <!-- Controles y Métricas Rápidas -->
  <div class="flex items-center gap-4">
    <div
      class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface-container-high text-on-surface border border-outline-variant/20"
    >
      <span class="material-symbols-outlined text-primary-container text-[18px]">pace</span>
      <span class="text-xs font-semibold">Ritmo de hoy: 18 min / pedido</span>
    </div>

    <button
      type="button"
      class="flex items-center gap-2 px-4 py-2 rounded-xl bg-primary-container text-white text-xs font-bold hover:bg-primary transition-colors cursor-pointer shadow-xs active:scale-98"
    >
      <span class="material-symbols-outlined text-[18px]">add_circle</span>
      <span>Nuevo Pedido</span>
    </button>

    <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white shadow-xs">
      <span class="material-symbols-outlined text-[18px]">person</span>
    </div>
  </div>
</header>
