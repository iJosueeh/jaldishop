<aside
  class="fixed left-0 top-0 h-screen w-60 bg-surface-container-lowest shadow-[0_1px_8px_rgba(0,0,0,0.04)] z-50 flex flex-col justify-between py-4 border-r border-outline-variant/30 font-sans"
>
  <div class="flex flex-col gap-4 px-4">
    <!-- Brand / Store Name -->
    <div class="flex flex-col gap-1 pb-2 border-b border-surface-container-highest">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-primary-container flex items-center justify-center shadow-xs text-white">
          <span class="material-symbols-outlined text-on-primary text-[20px]">storefront</span>
        </div>
        <span class="text-lg font-bold text-on-surface tracking-tight">JaldiShop</span>
      </div>
      <div class="flex items-center gap-2 mt-1">
        <span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
        <span class="text-xs text-on-surface-variant truncate font-medium">
          {{ storeName() }} · Abierto
        </span>
      </div>
    </div>

    <!-- Capacidad Hoy Widget -->
    <div class="p-3 rounded-xl bg-surface-container-low flex flex-col gap-1.5 border border-outline-variant/20">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-bold uppercase tracking-wider text-on-surface-variant">Capacidad Hoy</span>
        <span class="text-xs font-bold text-primary-container">8/10</span>
      </div>
      <div class="flex items-center gap-1 py-1">
        <span class="w-2 h-3.5 rounded-xs bg-primary-container"></span>
        <span class="w-2 h-3.5 rounded-xs bg-primary-container"></span>
        <span class="w-2 h-3.5 rounded-xs bg-primary-container"></span>
        <span class="w-2 h-3.5 rounded-xs bg-primary-container"></span>
        <span class="w-2 h-3.5 rounded-xs bg-primary-container"></span>
        <span class="w-2 h-3.5 rounded-xs bg-primary-container"></span>
        <span class="w-2 h-3.5 rounded-xs bg-primary-container"></span>
        <span class="w-2 h-3.5 rounded-xs bg-primary-container"></span>
        <span class="w-2 h-3.5 rounded-xs bg-surface-container-highest"></span>
        <span class="w-2 h-3.5 rounded-xs bg-surface-container-highest"></span>
      </div>
      <span class="text-xs text-on-surface-variant">Quedan 2 cupos disponibles</span>
    </div>

    <!-- Navegación Principal -->
    <nav class="flex flex-col gap-1">
      <a
        routerLink="/dashboard"
        routerLinkActive="bg-primary-container text-white font-bold shadow-xs"
        [routerLinkActiveOptions]="{ exact: true }"
        class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-sm font-semibold cursor-pointer"
      >
        <span class="material-symbols-outlined text-[20px]">home</span>
        <span>Inicio</span>
      </a>

      <a
        routerLink="/store"
        routerLinkActive="bg-primary-container text-white font-bold shadow-xs"
        class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-sm font-semibold cursor-pointer"
      >
        <span class="material-symbols-outlined text-[20px]">store</span>
        <span>Mi Tienda</span>
      </a>

      <a
        routerLink="/orders"
        routerLinkActive="bg-primary-container text-white font-bold shadow-xs"
        class="flex items-center justify-between px-3 py-2 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-sm font-semibold cursor-pointer"
      >
        <div class="flex items-center gap-2.5">
          <span class="material-symbols-outlined text-[20px]">receipt_long</span>
          <span>Pedidos</span>
        </div>
        <span class="px-2 py-0.5 rounded-lg bg-surface-container-high text-primary-container text-[11px] font-bold">
          4 hoy
        </span>
      </a>

      <a
        routerLink="/capacity"
        routerLinkActive="bg-primary-container text-white font-bold shadow-xs"
        class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-sm font-semibold cursor-pointer"
      >
        <span class="material-symbols-outlined text-[20px]">view_week</span>
        <span>Capacidad</span>
      </a>

      <a
        routerLink="/products"
        routerLinkActive="bg-primary-container text-white font-bold shadow-xs"
        class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-sm font-semibold cursor-pointer"
      >
        <span class="material-symbols-outlined text-[20px]">bakery_dining</span>
        <span>Productos</span>
      </a>

      <a
        routerLink="/customers"
        routerLinkActive="bg-primary-container text-white font-bold shadow-xs"
        class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-sm font-semibold cursor-pointer"
      >
        <span class="material-symbols-outlined text-[20px]">group</span>
        <span>Clientes</span>
      </a>
    </nav>
  </div>

  <!-- Pie de la barra lateral: Perfil & Logout -->
  <div class="flex flex-col gap-2 px-4">
    <a
      routerLink="/settings"
      routerLinkActive="bg-primary-container text-white font-bold"
      class="flex items-center gap-2.5 px-3 py-2 rounded-xl text-on-surface-variant hover:bg-surface-container-high hover:text-on-surface transition-colors text-sm font-semibold cursor-pointer"
    >
      <span class="material-symbols-outlined text-[20px]">tune</span>
      <span>Configuración</span>
    </a>

    <div class="p-3 rounded-xl bg-surface-container-low flex flex-col gap-2 border border-outline-variant/20">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shrink-0 text-white">
            <span class="material-symbols-outlined text-[18px]">person</span>
          </div>
          <div class="flex flex-col min-w-0">
            <span class="text-xs font-bold text-on-surface truncate">
              {{ userName() }}
            </span>
            <span class="text-[11px] text-on-surface-variant truncate">
              Comerciante
            </span>
          </div>
        </div>

        <button
          type="button"
          (click)="handleLogout()"
          title="Cerrar sesión"
          class="p-1.5 rounded-lg text-on-surface-variant hover:text-error hover:bg-surface-container-high transition-colors cursor-pointer"
        >
          <span class="material-symbols-outlined text-[18px]">logout</span>
        </button>
      </div>

      <div class="flex items-center justify-between px-2.5 py-1 rounded-lg bg-surface-container-lowest border border-outline-variant/10">
        <span class="text-[10px] font-bold uppercase tracking-wider text-primary-container">Recibiendo pedidos</span>
        <span class="w-2 h-2 rounded-full bg-primary-container"></span>
      </div>
    </div>
  </div>
</aside>
