<div class="min-h-screen bg-surface font-sans text-on-surface antialiased">
  <!-- Overlay oscuro de fondo en móvil cuando el menú está abierto -->
  @if (isMobileMenuOpen()) {
    <div
      (click)="closeMobileMenu()"
      class="fixed inset-0 bg-black/40 backdrop-blur-xs z-40 lg:hidden transition-opacity duration-200"
    ></div>
  }

  <!-- Barra lateral (Desktop fija, Mobile drawer) -->
  <app-siderbar [isOpen]="isMobileMenuOpen()" (closeSidebar)="closeMobileMenu()" />

  <!-- Contenedor Principal: en Desktop compensa los 240px (w-60) del sidebar -->
  <div class="lg:pl-60 flex flex-col min-h-screen">
    <!-- Header fijo: emite toggleSidebar al presionar el botón hamburguesa -->
    <app-header (toggleSidebar)="toggleMobileMenu()" />

    <!-- Área de Contenido Dinámico con flex flex-col flex-1 para ajustar el alto exacto -->
    <main class="relative pt-18 sm:pt-20 bg-surface w-full px-4 sm:px-6 lg:px-8 pb-4 sm:pb-5 flex-1 flex flex-col">
      <router-outlet />
    </main>
  </div>

  <!-- Modal Global de Nuevo Pedido accesible desde Header y cualquier vista -->
  <app-create-order-modal
    [isOpen]="orderService.isCreateModalOpen()"
    (closeModal)="orderService.closeCreateModal()"
    (orderCreated)="onOrderCreated($event)"
  />
</div>
