<div class="min-h-screen bg-surface font-sans text-on-surface antialiased">
  <!-- Overlay oscuro en móvil cuando el menú está abierto -->
  @if (isMobileMenuOpen()) {
    <div
      (click)="closeMobileMenu()"
      class="fixed inset-0 bg-black/40 backdrop-blur-xs z-40 lg:hidden transition-opacity duration-200"
    ></div>
  }

  <!-- Command Palette Global (Ctrl + K) -->
  <app-admin-command-palette
    [isOpen]="isCommandPaletteOpen()"
    (closePalette)="closeCommandPalette()"
  />

  <!-- Barra lateral exclusiva de Administración -->
  <app-admin-sidebar [isOpen]="isMobileMenuOpen()" (closeSidebar)="closeMobileMenu()" />

  <!-- Contenedor Principal: compensa los 240px (w-60) del sidebar en Desktop -->
  <div class="lg:pl-60 flex flex-col min-h-screen">
    <!-- Header de Administración -->
    <app-admin-header
      (toggleSidebar)="toggleMobileMenu()"
      (openCommandPalette)="openCommandPalette()"
    />

    <!-- Área de Contenido Dinámico Admin -->
    <main class="relative pt-18 sm:pt-20 bg-surface w-full px-4 sm:px-6 lg:px-8 pb-8 flex-1 flex flex-col">
      <router-outlet />
    </main>
  </div>
</div>
