<section
  class="bg-surface-container-lowest rounded-2xl p-4 shadow-xs border border-outline-variant/40 flex flex-col gap-3.5 w-full font-sans"
>
  <!-- Pestañas de Filtrado por Segmento -->
  <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5 w-full">
    <button
      (click)="onSelectTab('all')"
      type="button"
      class="px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all whitespace-nowrap cursor-pointer"
      [class.bg-primary]="activeTab() === 'all'"
      [class.text-on-primary]="activeTab() === 'all'"
      [class.shadow-xs]="activeTab() === 'all'"
      [class.bg-surface-container-high]="activeTab() !== 'all'"
      [class.text-on-surface-variant]="activeTab() !== 'all'"
      [class.hover:text-on-surface]="activeTab() !== 'all'"
    >
      Todos ({{ totalCount() }})
    </button>

    <button
      (click)="onSelectTab('vip')"
      type="button"
      class="px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all whitespace-nowrap cursor-pointer"
      [class.bg-secondary]="activeTab() === 'vip'"
      [class.text-on-secondary]="activeTab() === 'vip'"
      [class.shadow-xs]="activeTab() === 'vip'"
      [class.bg-surface-container-high]="activeTab() !== 'vip'"
      [class.text-on-surface-variant]="activeTab() !== 'vip'"
      [class.hover:text-on-surface]="activeTab() !== 'vip'"
    >
      VIP / Fidelizados ({{ vipCount() }})
    </button>

    <button
      (click)="onSelectTab('frequent')"
      type="button"
      class="px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all whitespace-nowrap cursor-pointer"
      [class.bg-primary]="activeTab() === 'frequent'"
      [class.text-on-primary]="activeTab() === 'frequent'"
      [class.shadow-xs]="activeTab() === 'frequent'"
      [class.bg-surface-container-high]="activeTab() !== 'frequent'"
      [class.text-on-surface-variant]="activeTab() !== 'frequent'"
      [class.hover:text-on-surface]="activeTab() !== 'frequent'"
    >
      Frecuentes ({{ frequentCount() }})
    </button>

    <button
      (click)="onSelectTab('new')"
      type="button"
      class="px-3.5 py-1.5 rounded-xl font-semibold text-xs transition-all whitespace-nowrap cursor-pointer"
      [class.bg-primary]="activeTab() === 'new'"
      [class.text-on-primary]="activeTab() === 'new'"
      [class.shadow-xs]="activeTab() === 'new'"
      [class.bg-surface-container-high]="activeTab() !== 'new'"
      [class.text-on-surface-variant]="activeTab() !== 'new'"
      [class.hover:text-on-surface]="activeTab() !== 'new'"
    >
      Nuevos ({{ newCount() }})
    </button>
  </div>

  <!-- Barra de Búsqueda -->
  <div
    class="flex items-center gap-2 bg-surface-container-high px-3.5 py-2 rounded-xl flex-1 focus-within:ring-2 focus-within:ring-primary/20 transition-all border border-outline-variant/30"
  >
    <ng-icon name="matSearchOutline" class="text-on-surface-variant text-lg" />
    <input
      [ngModel]="searchQuery()"
      (ngModelChange)="onSearchInput($event)"
      class="w-full bg-transparent text-on-surface placeholder:text-on-surface-variant focus:outline-none text-xs sm:text-sm font-medium"
      placeholder="Buscar por nombre, email o número de celular..."
      type="text"
    />
    @if (searchQuery().length > 0) {
      <button
        (click)="onClearSearch()"
        type="button"
        class="text-on-surface-variant hover:text-on-surface transition-colors cursor-pointer"
      >
        <ng-icon name="matCloseOutline" class="text-base" />
      </button>
    }
  </div>
</section>
