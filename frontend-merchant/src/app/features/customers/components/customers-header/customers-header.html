<header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 font-sans">
  <div class="flex flex-col gap-1 min-w-0">
    <div class="flex items-center gap-2.5 flex-wrap">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-on-surface tracking-tight">
        Gestión de Clientes
      </h1>
      <span class="px-2.5 py-0.5 rounded-full bg-surface-container-high text-primary font-bold text-xs uppercase tracking-wider border border-outline-variant/40">
        {{ totalCustomers() }} Registrados
      </span>
    </div>
    <p class="text-sm text-on-surface-variant">
      Directorio de compradores de tu tienda, historial de compras y contacto directo.
    </p>
  </div>

  <div class="flex items-center gap-2.5 shrink-0">
    <button
      (click)="onExportCsv()"
      type="button"
      class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors shadow-xs border border-outline-variant/40 text-sm font-semibold cursor-pointer"
    >
      <ng-icon name="matDownloadOutline" class="text-lg text-on-surface-variant" />
      <span>Exportar CSV</span>
    </button>
  </div>
</header>
