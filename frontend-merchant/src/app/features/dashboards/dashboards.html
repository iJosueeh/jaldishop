<div class="flex flex-col w-full gap-6 font-sans">
  <!-- 1. Cabecera de Página con Saludo, Estado y Fecha -->
  <app-dashboard-header />

  <!-- 2. KPIs de Capacidad, Pedidos y Ritmo Operativo -->
  <app-dashboard-kpis />

  <!-- 3. Distribución Principal en 2 Columnas Equilibradas -->
  <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 w-full">
    <!-- Columna Izquierda (8/12 - 65%): Flujo de Cocina y Pedidos Prioritarios -->
    <section class="lg:col-span-8 flex flex-col gap-4">
      <app-priority-orders />
    </section>

    <!-- Columna Derecha (4/12 - 35%): Próximas Entregas y Alertas de Stock -->
    <section class="lg:col-span-4 flex flex-col gap-4">
      <app-logistics-alerts />
    </section>
  </div>

  <!-- 4. Barra Inferior de Acciones Rápidas -->
  <app-quick-actions />
</div>
