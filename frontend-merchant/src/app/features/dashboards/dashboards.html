<div class="flex flex-col flex-1 w-full gap-4 sm:gap-6 font-sans justify-between">
  <!-- Contenido Superior del Dashboard -->
  <div class="flex flex-col w-full gap-4 sm:gap-6">
    <!-- 1. Cabecera de Página con Saludo, Estado y Fecha -->
    <app-dashboard-header />

    <!-- 2. KPIs de Capacidad, Pedidos y Ritmo Operativo -->
    <app-dashboard-kpis />

    <!-- 3. Distribución Principal en 2 Columnas Equilibradas -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 sm:gap-6 w-full">
      <!-- Columna Izquierda (8/12 - 65%): Flujo de Cocina y Pedidos Prioritarios -->
      <section class="lg:col-span-8 flex flex-col gap-4">
        <app-priority-orders />
      </section>

      <!-- Columna Derecha (4/12 - 35%): Próximas Entregas y Alertas de Stock -->
      <section class="lg:col-span-4 flex flex-col gap-4">
        <app-logistics-alerts />
      </section>
    </div>
  </div>

  <!-- 4. Barra Inferior de Acciones Rápidas (anclada al fondo sin huecos sobrantes) -->
  <div class="mt-auto pt-3 sm:pt-4">
    <app-quick-actions />
  </div>
</div>
