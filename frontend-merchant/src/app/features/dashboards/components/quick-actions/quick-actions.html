<section
  class="p-3.5 sm:p-4 rounded-2xl bg-white border border-[#e7e0d6] shadow-2xs flex flex-col md:flex-row md:items-center justify-between gap-3 sm:gap-4 font-sans transition-all"
>
  <div class="flex items-center gap-2.5 text-stone-700">
    <div class="w-8 h-8 rounded-xl bg-emerald-50 border border-emerald-500/20 flex items-center justify-center text-[#005141] shrink-0">
      <ng-icon name="matBoltOutline" class="text-[18px]" />
    </div>
    <span class="text-xs font-bold text-stone-800 uppercase tracking-wider">Acciones rápidas:</span>
  </div>

  <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-2 sm:gap-2.5 w-full md:w-auto">
    <button
      type="button"
      (click)="handlePauseOrders()"
      class="flex items-center justify-center gap-1.5 px-3.5 py-2.5 sm:py-2 rounded-xl bg-[#faf7f2] hover:bg-stone-100 text-stone-800 transition-colors text-xs font-semibold cursor-pointer border border-[#e7e0d6] active:scale-98 shadow-2xs"
    >
      <ng-icon name="matPauseCircleOutline" class="text-[18px] text-amber-700" />
      <span>Pausar pedidos</span>
    </button>

    <a
      routerLink="/products"
      class="flex items-center justify-center gap-1.5 px-3.5 py-2.5 sm:py-2 rounded-xl bg-[#faf7f2] hover:bg-stone-100 text-stone-800 transition-colors text-xs font-semibold cursor-pointer border border-[#e7e0d6] active:scale-98 shadow-2xs"
    >
      <ng-icon name="matInventory2Outline" class="text-[18px] text-[#005141]" />
      <span>Ajustar stock</span>
    </a>

    <a
      routerLink="/store"
      class="flex items-center justify-center gap-1.5 px-3.5 py-2.5 sm:py-2 rounded-xl bg-[#faf7f2] hover:bg-stone-100 text-stone-800 transition-colors text-xs font-semibold cursor-pointer border border-[#e7e0d6] active:scale-98 shadow-2xs"
    >
      <ng-icon name="matStorefrontOutline" class="text-[18px] text-[#005141]" />
      <span>Mi tienda</span>
    </a>

    <a
      routerLink="/capacity"
      class="flex items-center justify-center gap-1.5 px-3.5 py-2.5 sm:py-2 rounded-xl bg-[#faf7f2] hover:bg-stone-100 text-stone-800 transition-colors text-xs font-semibold cursor-pointer border border-[#e7e0d6] active:scale-98 shadow-2xs"
    >
      <ng-icon name="matTuneOutline" class="text-[18px] text-stone-500" />
      <span>Capacidad</span>
    </a>
  </div>
</section>
