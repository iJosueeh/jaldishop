<section
  class="p-3.5 sm:p-4 rounded-2xl bg-surface-bright border border-outline-variant shadow-2xs flex flex-col md:flex-row md:items-center justify-between gap-3 sm:gap-4 font-sans transition-all"
>
  <div class="flex items-center gap-2.5 text-on-surface-variant">
    <div class="w-8 h-8 rounded-xl bg-primary-fixed/40 border border-primary/20 flex items-center justify-center text-primary shrink-0">
      <ng-icon name="matBoltOutline" class="text-[18px]" />
    </div>
    <span class="text-xs font-bold text-on-surface uppercase tracking-wider">Acciones rápidas:</span>
  </div>

  <div class="grid grid-cols-2 sm:flex sm:flex-wrap items-center gap-2 sm:gap-2.5 w-full md:w-auto">
    <button
      type="button"
      (click)="handlePauseOrders()"
      class="flex items-center justify-center gap-1.5 px-3.5 py-2.5 sm:py-2 rounded-xl bg-surface hover:bg-surface-dim text-on-surface transition-colors text-xs font-semibold cursor-pointer border border-outline-variant active:scale-98 shadow-2xs"
    >
      <ng-icon name="matPauseCircleOutline" class="text-[18px] text-amber-700" />
      <span>Pausar pedidos</span>
    </button>

    <a
      routerLink="/products"
      class="flex items-center justify-center gap-1.5 px-3.5 py-2.5 sm:py-2 rounded-xl bg-surface hover:bg-surface-dim text-on-surface transition-colors text-xs font-semibold cursor-pointer border border-outline-variant active:scale-98 shadow-2xs"
    >
      <ng-icon name="matInventory2Outline" class="text-[18px] text-primary" />
      <span>Ajustar stock</span>
    </a>

    <a
      routerLink="/store"
      class="flex items-center justify-center gap-1.5 px-3.5 py-2.5 sm:py-2 rounded-xl bg-surface hover:bg-surface-dim text-on-surface transition-colors text-xs font-semibold cursor-pointer border border-outline-variant active:scale-98 shadow-2xs"
    >
      <ng-icon name="matStorefrontOutline" class="text-[18px] text-primary" />
      <span>Mi tienda</span>
    </a>

    <a
      routerLink="/capacity"
      class="flex items-center justify-center gap-1.5 px-3.5 py-2.5 sm:py-2 rounded-xl bg-surface hover:bg-surface-dim text-on-surface transition-colors text-xs font-semibold cursor-pointer border border-outline-variant active:scale-98 shadow-2xs"
    >
      <ng-icon name="matTuneOutline" class="text-[18px] text-on-surface-variant" />
      <span>Capacidad</span>
    </a>
  </div>

  <app-confirm-modal
    [isOpen]="isPauseModalOpen()"
    title="¿Pausar recepción de pedidos?"
    message="Para detener temporalmente nuevos pedidos en tu catálogo cuando tu capacidad operativa esté saturada, gestiona o desactiva las franjas horarias de hoy en el panel de Capacidad."
    confirmText="Ir a Capacidad"
    cancelText="Volver al panel"
    [isDanger]="false"
    (confirm)="onConfirmPause()"
    (cancel)="onDismissPause()"
  />
</section>
