<header class="flex flex-col md:flex-row md:items-center justify-between gap-4 pt-1 font-sans">
  <div class="flex flex-col gap-1">
    <div class="flex items-center gap-2 flex-wrap">
      <h1 class="text-2xl lg:text-3xl font-bold text-on-surface tracking-tight">
        Buenos días, {{ storeName() }}
      </h1>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-surface-container text-primary-container text-[11px] font-bold uppercase tracking-wider">
        <span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
        En operación
      </span>
      <span class="text-xs text-on-surface-variant">
        · {{ currentDate() }}
      </span>
    </div>
    <p class="text-sm text-on-surface-variant max-w-2xl">
      Así marcha tu negocio hoy.
    </p>
  </div>

  <div class="flex items-center gap-2.5 self-start md:self-auto shrink-0">
    <button
      type="button"
      class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors text-xs font-bold shadow-2xs border border-outline-variant/30 cursor-pointer"
    >
      <span class="material-symbols-outlined text-[18px] text-on-surface-variant">calendar_month</span>
      <span>Ver agenda</span>
    </button>

    <button
      type="button"
      class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-primary-container text-white hover:bg-primary transition-colors text-xs font-bold shadow-2xs cursor-pointer active:scale-98"
    >
      <span class="material-symbols-outlined text-[18px]">add_circle</span>
      <span>Nuevo Pedido</span>
    </button>
  </div>
</header>
