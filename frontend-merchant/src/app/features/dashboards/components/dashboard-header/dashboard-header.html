<header
  class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4 pt-1 font-sans"
>
  <div class="flex flex-col gap-1">
    <div class="flex items-center gap-2 flex-wrap">
      <h1 class="text-xl sm:text-2xl lg:text-3xl font-bold text-on-surface tracking-tight">
        Buenos días, {{ firstName() }}
      </h1>
      <span
        class="inline-flex items-center gap-1.5 px-2.5 py-0.5 sm:py-1 rounded-full text-[10px] sm:text-[11px] font-bold uppercase tracking-wider shrink-0"
        [class.bg-surface-container]="isOpen()"
        [class.text-primary-container]="isOpen()"
        [class.bg-surface-container-high]="!isOpen()"
        [class.text-on-surface-variant]="!isOpen()"
      >
        <span
          class="w-2 h-2 rounded-full"
          [class.bg-primary-container]="isOpen()"
          [class.animate-pulse]="isOpen()"
          [class.bg-outline-variant]="!isOpen()"
        ></span>
        {{ isOpen() ? 'En operación' : 'En pausa' }}
      </span>
      <span class="text-xs text-on-surface-variant hidden sm:inline"> · {{ currentDate() }} </span>
    </div>
    <p class="text-xs sm:text-sm text-on-surface-variant max-w-2xl">Así marcha tu negocio hoy.</p>
  </div>

  <div class="flex items-center gap-2 self-stretch sm:self-auto shrink-0">
    <button
      type="button"
      (click)="copyStoreLink()"
      class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-xl bg-surface-container-lowest text-on-surface hover:bg-surface-container-high transition-colors text-xs font-bold shadow-2xs border border-outline-variant/30 cursor-pointer active:scale-98"
      title="Copiar enlace de mi catálogo"
    >
      <ng-icon name="matShareOutline" class="text-[18px] text-primary-container" />
      <span>Compartir Catálogo</span>
    </button>

    <a
      routerLink="/store"
      class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2 rounded-xl bg-primary-container text-white hover:bg-primary transition-colors text-xs font-bold shadow-2xs cursor-pointer active:scale-98"
    >
      <ng-icon name="matStorefrontOutline" class="text-[18px]" />
      <span>Mi Tienda</span>
    </a>
  </div>
</header>
