<div class="flex flex-col flex-1 w-full gap-5 sm:gap-6 font-sans pb-10">
  <!-- 1. Encabezado de Página -->
  <app-orders-header
    (newOrder)="onNewOrder()"
    (adjustPace)="onAdjustPace()"
    (printOrders)="onPrintOrders()"
  />

  <!-- 2. Alerta / Banner Consolidado Unificado (solo si hay órdenes activas) -->
  @if (orderService.totalElements() > 0) {
    <app-orders-alert-banner
      [urgentOrder]="urgentOrder()"
      [readyCount]="orderService.readyCount()"
      (viewUrgent)="onTabChange('IN_PREPARATION')"
    />
  }

  <!-- 3. Indicadores de Ritmo y Métricas Rápidas -->
  <app-orders-kpis
    [capacityTotal]="capacityService.todayEffectiveCapacity()"
    [capacityOccupied]="null"
    [remainingDeliveries]="orderService.remainingDeliveriesCount()"
    [inPrepCount]="orderService.inPrepCount()"
    [readyCount]="orderService.readyCount()"
    [averagePaceMin]="orderService.averagePrepTimeMin()"
  />

  <!-- 4. Filtros Unificados y Búsqueda Compacta -->
  <app-orders-filter-bar
    [activeTab]="activeTab()"
    [totalCount]="activeTab() === 'ALL' ? orderService.totalElements() : '—'"
    [confirmedCount]="activeTab() === 'CONFIRMED' ? orderService.totalElements() : '—'"
    [inPrepCount]="activeTab() === 'IN_PREPARATION' ? orderService.totalElements() : '—'"
    [readyCount]="activeTab() === 'READY' ? orderService.totalElements() : '—'"
    [completedCount]="activeTab() === 'COMPLETED' ? orderService.totalElements() : '—'"
    [searchQuery]="orderService.searchQuery()"
    [selectedChannel]="orderService.channelFilter()"
    (tabChange)="onTabChange($event)"
    (searchChange)="onSearchChange($event)"
    (channelChange)="onChannelChange($event)"
  />

  <!-- 5. Área de Pedidos / Comandas Modulares con Skeletons y Estados Vacíos -->
  <app-orders-grid
    [orders]="paginatedOrders()"
    [isLoading]="orderService.isLoading()"
    [isEmptyOrders]="orderService.isEmptyOrders()"
    [isFilterEmpty]="orderService.isFilterEmpty()"
    [isSearchEmpty]="orderService.isSearchEmpty()"
    [updatingOrderIds]="orderService.updatingOrderIds()"
    [pendingVerificationOrderIds]="orderService.pendingVerificationOrderIds()"
    (statusAdvance)="onStatusAdvance($event)"
    (cancelOrder)="onCancelOrder($event)"
    (whatsAppClick)="onWhatsAppClick($event)"
    (openDetails)="onOpenDetails($event)"
    (verifyStatus)="onVerifyStatus($event)"
    (resetFilter)="onTabChange('ALL')"
    (createNewOrder)="onNewOrder()"
  />

  <!-- 6. Paginación del Servidor / Resumen de Turno -->
  @if (!orderService.isLoading() && orderService.totalElements() > orderService.pageSize()) {
    <app-pagination
      [currentPage]="currentPageUI()"
      [totalItems]="orderService.totalElements()"
      [pageSize]="orderService.pageSize()"
      itemLabel="pedidos del turno"
      (pageChange)="onPageChange($event)"
    />
  }

  <!-- 7. Drawer Lateral de Detalle Completo del Pedido -->
  <app-order-details-drawer
    [isOpen]="orderService.isDrawerOpen()"
    [order]="drawerOrder()"
    [isLoading]="orderService.isDetailLoading()"
    [errorMessage]="orderService.detailError()"
    [isUpdating]="orderService.isUpdating(drawerOrder()?.id ?? '')"
    [isPendingVerification]="orderService.isPendingVerification(drawerOrder()?.id ?? '')"
    (closeDrawer)="onCloseDrawer()"
    (statusChange)="onDrawerStatusChange($event)"
    (cancelOrder)="onCancelOrder($event)"
    (verifyStatus)="onVerifyStatus($event)"
  />

  <!-- 8. Modal de Confirmación de Cancelación de Pedido -->
  <app-confirm-modal
    [isOpen]="isCancelModalOpen()"
    title="¿Cancelar este pedido?"
    [message]="cancelModalMessage()"
    confirmText="Sí, cancelar pedido"
    cancelText="Volver"
    [isDanger]="true"
    (confirm)="onConfirmCancel()"
    (cancel)="onDismissCancel()"
  />
</div>
