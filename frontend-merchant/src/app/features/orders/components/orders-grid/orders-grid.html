<section class="grid grid-cols-1 lg:grid-cols-2 gap-4">
  @for (order of orders(); track order.id) {
    <app-orders-card
      [order]="order"
      (statusAdvance)="statusAdvance.emit($event)"
      (whatsAppClick)="whatsAppClick.emit($event)"
      (openDetails)="openDetails.emit($event)"
    />
  } @empty {
    <!-- Estado Vacío -->
    <div
      class="col-span-full p-8 sm:p-12 rounded-2xl bg-surface-container-lowest border border-dashed border-outline-variant/50 text-center flex flex-col items-center justify-center gap-3"
    >
      <div
        class="w-12 h-12 rounded-2xl bg-primary-container/10 text-primary-container flex items-center justify-center"
      >
        <ng-icon name="matReceiptLongOutline" class="text-[28px]" />
      </div>
      <div>
        <h4 class="text-base font-bold text-on-surface">No se encontraron pedidos</h4>
        <p class="text-xs text-on-surface-variant max-w-sm mt-1">
          No hay pedidos que coincidan con los filtros seleccionados o la búsqueda actual.
        </p>
      </div>
      <button
        type="button"
        (click)="resetFilter.emit()"
        class="mt-2 flex items-center gap-1.5 px-4 py-2 rounded-xl bg-primary-container text-white hover:bg-primary transition-colors text-xs font-bold shadow-2xs cursor-pointer active:scale-98"
      >
        <span>Ver todos los pedidos</span>
      </button>
    </div>
  }
</section>
