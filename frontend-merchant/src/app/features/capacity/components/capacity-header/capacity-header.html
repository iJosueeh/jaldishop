<header class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 sm:gap-4 pt-1">
  <div class="flex flex-col gap-1">
    <div class="flex items-center gap-2.5 flex-wrap">
      <h1 class="text-xl sm:text-2xl lg:text-3xl font-bold text-on-surface tracking-tight">
        Capacidad Operativa
      </h1>
      <span
        class="inline-flex items-center gap-1.5 px-2.5 py-0.5 sm:py-1 rounded-full bg-emerald-500/10 text-emerald-700 dark:text-emerald-400 text-[10px] sm:text-[11px] font-bold uppercase tracking-wider shrink-0 border border-emerald-500/20"
      >
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        En Vivo · Operación Activa
      </span>
    </div>
    <p class="text-xs sm:text-sm text-on-surface-variant max-w-2xl">
      Controla los cupos máximos de pedidos por franjas horarias para evitar la saturación de tus operaciones.
    </p>
  </div>

  <div class="flex items-center gap-2 self-stretch sm:self-auto shrink-0">
    <button
      type="button"
      (click)="newSlot.emit()"
      class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-4 py-2.5 rounded-xl bg-primary-container text-white hover:bg-primary transition-colors text-xs font-bold shadow-2xs cursor-pointer active:scale-98"
    >
      <ng-icon name="matAddCircleOutline" class="text-[18px]" />
      <span>Nueva Franja</span>
    </button>
  </div>
</header>
