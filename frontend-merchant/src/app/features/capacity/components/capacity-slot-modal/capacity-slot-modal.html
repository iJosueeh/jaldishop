@if (isOpen()) {
  <!-- Backdrop oscuro con desenfoque suave -->
  <div
    class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-xs animate-fade-in font-sans"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-slot-title"
  >
    <div
      class="bg-surface-container-lowest rounded-2xl shadow-xl border border-outline-variant/30 max-w-md w-full p-6 flex flex-col gap-5 animate-scale-up"
    >
      <!-- Cabecera del Modal -->
      <div class="flex items-center justify-between">
        <div>
          <h3 id="modal-slot-title" class="text-base sm:text-lg font-bold text-on-surface">
            {{ slotToEdit() ? 'Editar Franja Horaria' : 'Nueva Franja Horaria' }}
          </h3>
          <p class="text-xs text-on-surface-variant">
            Día: <strong class="text-on-surface">{{ dayLabel() }}</strong>
          </p>
        </div>
        <button
          type="button"
          (click)="closeModal.emit()"
          class="p-1.5 rounded-xl text-on-surface-variant hover:bg-surface-container-high transition-colors cursor-pointer"
          aria-label="Cerrar modal"
        >
          <ng-icon name="matCloseOutline" class="text-[20px]" />
        </button>
      </div>

      <!-- Alerta de Error en Modal -->
      @if (errorMessage()) {
        <div
          class="p-3 rounded-xl bg-error-container text-on-error-container text-xs font-medium flex items-center gap-2"
        >
          <ng-icon name="matErrorOutline" class="text-[18px] shrink-0" />
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Formulario Reactivo -->
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <!-- Selector Reutilizable de Franja Horaria -->
        <app-time-range-picker [form]="form" />

        <div class="flex flex-col gap-1.5">
          <label for="maxCapacity" class="text-xs font-bold text-on-surface">
            Cupo Máximo (Pedidos)
          </label>
          <input
            id="maxCapacity"
            type="number"
            min="1"
            max="500"
            formControlName="maxCapacity"
            placeholder="Ej. 10"
            class="w-full px-3 py-2 text-xs rounded-xl bg-surface-container-low border border-outline-variant/40 text-on-surface focus:outline-none focus:border-primary-container font-medium"
          />
          <span class="text-[11px] text-on-surface-variant">
            Límite de pedidos que tu negocio puede despachar en esta franja.
          </span>
        </div>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-outline-variant/20">
          <button
            type="button"
            (click)="closeModal.emit()"
            class="px-4 py-2 rounded-xl text-xs font-bold text-on-surface-variant hover:bg-surface-container-high transition-colors cursor-pointer"
          >
            Cancelar
          </button>
          <button
            type="submit"
            [disabled]="isSubmitting() || form.invalid"
            class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-primary-container text-white hover:bg-primary transition-colors text-xs font-bold shadow-2xs cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
          >
            @if (isSubmitting()) {
              <span
                class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"
              ></span>
              <span>Guardando...</span>
            } @else {
              <ng-icon name="matCheckOutline" class="text-[18px]" />
              <span>{{ slotToEdit() ? 'Guardar Cambios' : 'Guardar Franja' }}</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
