<div
  class="flex items-center gap-2 p-1.5 rounded-2xl bg-surface-container-low border border-outline-variant/20 w-fit font-sans"
  role="tablist"
  aria-label="Pestañas de Capacidad"
>
  <!-- Pestaña 1: Horario Semanal Recurrente -->
  <button
    type="button"
    role="tab"
    [attr.aria-selected]="activeTab() === 'SCHEDULE'"
    (click)="tabChange.emit('SCHEDULE')"
    class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer"
    [class.bg-surface-container-lowest]="activeTab() === 'SCHEDULE'"
    [class.text-on-surface]="activeTab() === 'SCHEDULE'"
    [class.shadow-xs]="activeTab() === 'SCHEDULE'"
    [class.text-on-surface-variant]="activeTab() !== 'SCHEDULE'"
    [class.hover:text-on-surface]="activeTab() !== 'SCHEDULE'"
  >
    <ng-icon name="matScheduleOutline" class="text-[16px]" />
    <span>Horario Semanal Recurrente</span>
  </button>

  <!-- Pestaña 2: Fechas Especiales & Excepciones -->
  <button
    type="button"
    role="tab"
    [attr.aria-selected]="activeTab() === 'EXCEPTIONS'"
    (click)="tabChange.emit('EXCEPTIONS')"
    class="flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-bold transition-all cursor-pointer"
    [class.bg-surface-container-lowest]="activeTab() === 'EXCEPTIONS'"
    [class.text-on-surface]="activeTab() === 'EXCEPTIONS'"
    [class.shadow-xs]="activeTab() === 'EXCEPTIONS'"
    [class.text-on-surface-variant]="activeTab() !== 'EXCEPTIONS'"
    [class.hover:text-on-surface]="activeTab() !== 'EXCEPTIONS'"
  >
    <ng-icon name="matEventBusyOutline" class="text-[16px]" />
    <span>Fechas Especiales & Excepciones</span>
    @if (exceptionsCount() > 0) {
      <span class="px-2 py-0.5 rounded-full bg-primary-fixed/60 text-primary-container text-[10px] font-bold">
        {{ exceptionsCount() }}
      </span>
    }
  </button>
</div>
