<div class="flex flex-col flex-1 w-full gap-5 sm:gap-6 font-sans pb-8">
  <!-- 1. Cabecera Principal -->
  <app-capacity-header (newSlot)="openCreateModal()" />

  <!-- 2. Selector de Pestañas (Componente Standalone) -->
  <app-capacity-tab-selector
    [activeTab]="activeTab()"
    [exceptionsCount]="allExceptions().length"
    (tabChange)="setActiveTab($event)"
  />

  <!-- Contenido de la Pestaña 1: Horario Semanal -->
  @if (activeTab() === 'SCHEDULE') {
    <!-- KPIs del Día -->
    <app-capacity-kpis
      [dayLabel]="selectedDayInfo().label"
      [totalCapacity]="selectedDayTotalCapacity()"
      [totalSlotsCount]="selectedDayConfigurations().length"
      [activeSlotsCount]="getActiveSlotsCount(selectedDay())"
    />

    <!-- Selector de Días de la Semana -->
    <app-capacity-day-selector
      [days]="daysOfWeek"
      [selectedDay]="selectedDay()"
      [allConfigurations]="allConfigurations()"
      (dayChange)="selectDay($event)"
    />

    <!-- Listado de Franjas Horarias -->
    <app-capacity-slots-list
      [slots]="selectedDayConfigurations()"
      [dayLabel]="selectedDayInfo().label"
      [isLoading]="isLoading()"
      (toggleStatus)="onToggleStatus($event)"
      (createSlot)="openCreateModal()"
    />
  }

  <!-- Contenido de la Pestaña 2: Fechas Especiales & Excepciones -->
  @if (activeTab() === 'EXCEPTIONS') {
    <app-capacity-exceptions-list
      [exceptions]="allExceptions()"
      [isLoading]="isLoadingExceptions()"
      (toggleStatus)="onToggleExceptionStatus($event)"
      (createException)="openCreateExceptionModal()"
    />
  }

  <!-- 3. Modal de Creación de Franja Semanal (Componente Standalone) -->
  <app-capacity-slot-modal
    [isOpen]="isModalOpen()"
    [isSubmitting]="isSubmitting()"
    [dayLabel]="selectedDayInfo().label"
    [dayOfWeek]="selectedDay()"
    (closeModal)="closeModal()"
    (saveSlot)="onSaveSlot($event)"
  />

  <!-- 4. Modal de Creación de Excepción (Componente Standalone) -->
  <app-capacity-exception-modal
    [isOpen]="isExceptionModalOpen()"
    [isSubmitting]="isSubmittingException()"
    (closeModal)="closeExceptionModal()"
    (saveException)="onSaveException($event)"
  />
</div>
