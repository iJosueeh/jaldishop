<section class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
  <div class="flex flex-col gap-1">
    <div class="flex items-center gap-2 flex-wrap">
      <h1 class="text-2xl sm:text-3xl font-bold text-on-surface tracking-tight">
        Catálogo de Productos
      </h1>
      <span
        class="inline-flex items-center px-2.5 py-0.5 rounded-full bg-primary/10 text-primary text-xs font-semibold tracking-wide"
      >
        {{ activeCount() }} productos activos
      </span>
    </div>
    <p class="text-xs sm:text-sm text-on-surface-variant max-w-2xl">
      Gestión de recetas, precios y disponibilidad inmediata o programada para canales de venta.
    </p>
  </div>

  <div class="flex items-center gap-2 shrink-0 flex-wrap">
    <button
      type="button"
      (click)="adjustAvailability.emit()"
      class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-surface-container-lowest border border-outline-variant/30 shadow-xs hover:bg-surface-container-high text-on-surface text-xs sm:text-sm font-semibold transition-colors cursor-pointer"
    >
      <ng-icon name="matTuneOutline" class="text-base sm:text-lg text-on-surface-variant"></ng-icon>
      <span>Ajustar Disponibilidad</span>
    </button>
    <button
      type="button"
      class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-surface-container-lowest border border-outline-variant/30 shadow-xs hover:bg-surface-container-high flex items-center justify-center text-on-surface-variant transition-colors cursor-pointer"
      title="Más acciones"
      aria-label="Más acciones"
    >
      <ng-icon name="matMoreHorizOutline" class="text-lg sm:text-xl"></ng-icon>
    </button>
    <button
      type="button"
      (click)="createNewProduct.emit()"
      class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-primary text-on-primary text-xs sm:text-sm font-semibold hover:bg-primary/90 shadow-xs transition-colors cursor-pointer"
    >
      <ng-icon name="matAddOutline" class="text-base sm:text-lg"></ng-icon>
      <span>Nuevo Producto</span>
    </button>
  </div>
</section>
