@if (attentionCount() > 0) {
  <div
    class="w-full rounded-xl bg-surface-container-low border border-outline-variant/30 p-4 shadow-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3"
  >
    <div class="flex items-center gap-3 text-on-surface">
      <div
        class="w-8 h-8 rounded-lg bg-amber-500/15 text-amber-800 dark:text-amber-300 flex items-center justify-center shrink-0"
      >
        <ng-icon name="matWarningOutline" class="text-xl text-amber-700"></ng-icon>
      </div>
      <p class="text-sm text-on-surface">
        <span class="font-semibold text-on-surface">Atención requerida:</span>
        {{ attentionMessage() }}
      </p>
    </div>
    <button
      type="button"
      (click)="viewDetails.emit()"
      class="inline-flex items-center gap-1.5 text-primary font-semibold text-sm hover:underline shrink-0 whitespace-nowrap cursor-pointer pl-11 sm:pl-0"
    >
      <span>Ver detalles</span>
      <ng-icon name="matArrowForwardOutline" class="text-base"></ng-icon>
    </button>
  </div>
}
