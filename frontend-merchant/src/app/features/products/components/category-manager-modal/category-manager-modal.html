@if (isOpen()) {
  <div
    class="fixed inset-0 bg-black/60 backdrop-blur-xs z-[950] flex items-center justify-center p-4 font-sans"
    role="dialog"
    aria-modal="true"
    aria-labelledby="category-modal-title"
  >
    <div class="bg-surface-container-lowest border border-outline-variant/40 rounded-3xl shadow-2xl w-full max-w-lg p-5 sm:p-6 flex flex-col gap-4 max-h-[85vh]">
      <div class="flex items-center justify-between border-b border-outline-variant/20 pb-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-primary/10 text-primary flex items-center justify-center">
            <ng-icon name="matCategoryOutline" class="text-[20px]" />
          </div>
          <h2 id="category-modal-title" class="text-base font-black text-on-surface">
            Gestionar Categorías
          </h2>
        </div>
        <button
          type="button"
          (click)="closeModal.emit()"
          class="p-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container cursor-pointer"
          aria-label="Cerrar"
        >
          <ng-icon name="matCloseOutline" class="text-[20px]" />
        </button>
      </div>

      <!-- Nueva categoría -->
      <div class="flex items-center gap-2">
        <input
          type="text"
          [ngModel]="newName()"
          (ngModelChange)="newName.set($event)"
          placeholder="Nueva categoría (ej. Bebidas Frías)"
          class="flex-1 px-3.5 py-2 rounded-xl text-xs bg-surface-container-low border border-outline-variant/30 text-on-surface focus:outline-none focus:border-primary"
        />
        <button
          type="button"
          [disabled]="!newName().trim() || isCreating()"
          (click)="createCategory()"
          class="px-4 py-2 rounded-xl bg-primary text-on-primary text-xs font-bold hover:bg-primary/90 disabled:opacity-40 cursor-pointer flex items-center gap-1"
        >
          <ng-icon name="matAddOutline" class="text-[16px]" />
          <span>Crear</span>
        </button>
      </div>

      <!-- Listado -->
      <div class="flex-1 overflow-y-auto flex flex-col gap-2 pr-1">
        @for (cat of categories(); track cat.id) {
          <div class="p-3 rounded-xl bg-surface-container-low border border-outline-variant/20 flex items-center justify-between gap-2">
            @if (editingId() === cat.id) {
              <div class="flex-1 flex items-center gap-2">
                <input
                  type="text"
                  [ngModel]="editName()"
                  (ngModelChange)="editName.set($event)"
                  class="flex-1 px-2.5 py-1.5 rounded-lg text-xs bg-surface-container-lowest border border-primary/40 text-on-surface"
                />
                <button
                  type="button"
                  [disabled]="isSavingEdit() || !editName().trim()"
                  (click)="saveEdit(cat)"
                  class="p-1.5 rounded-lg bg-emerald-600 text-white hover:bg-emerald-700 cursor-pointer"
                  aria-label="Guardar"
                >
                  <ng-icon name="matCheckOutline" class="text-[16px]" />
                </button>
                <button
                  type="button"
                  (click)="cancelEdit()"
                  class="p-1.5 rounded-lg bg-surface-container text-on-surface-variant cursor-pointer"
                  aria-label="Cancelar"
                >
                  <ng-icon name="matCloseOutline" class="text-[16px]" />
                </button>
              </div>
            } @else {
              <div class="flex flex-col min-w-0">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-bold text-on-surface truncate">{{ cat.name }}</span>
                  <span
                    class="px-2 py-0.5 rounded-full text-[10px] font-bold"
                    [class.bg-emerald-500/10]="cat.status !== 'INACTIVE'"
                    [class.text-emerald-700]="cat.status !== 'INACTIVE'"
                    [class.bg-amber-500/10]="cat.status === 'INACTIVE'"
                    [class.text-amber-700]="cat.status === 'INACTIVE'"
                  >
                    {{ cat.status === 'INACTIVE' ? 'Inactiva' : 'Activa' }}
                  </span>
                </div>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                <button
                  type="button"
                  (click)="startEdit(cat)"
                  class="p-1.5 rounded-lg bg-surface-container-lowest border border-outline-variant/30 text-on-surface hover:bg-surface-container-high cursor-pointer"
                  title="Renombrar categoría"
                >
                  <ng-icon name="matEditOutline" class="text-[15px]" />
                </button>
                <button
                  type="button"
                  (click)="toggleStatus(cat)"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-bold border border-outline-variant/30 bg-surface-container-lowest hover:bg-surface-container-high cursor-pointer"
                >
                  {{ cat.status === 'INACTIVE' ? 'Activar' : 'Pausar' }}
                </button>
                <button
                  type="button"
                  (click)="requestDelete(cat)"
                  class="p-1.5 rounded-lg bg-rose-500/10 text-rose-600 border border-rose-500/30 hover:bg-rose-600 hover:text-white cursor-pointer"
                  title="Eliminar categoría"
                >
                  <ng-icon name="matDeleteOutline" class="text-[15px]" />
                </button>
              </div>
            }
          </div>
        } @empty {
          <p class="text-xs text-on-surface-variant text-center py-6">No hay categorías creadas aún.</p>
        }
      </div>
    </div>
  </div>

  <app-destructive-action-modal
    [isOpen]="!!deleteTarget()"
    title="¿Eliminar categoría permanentemente?"
    message="Si esta categoría no tiene productos asociados, se eliminará de forma definitiva."
    fallbackLabel="Desactivar categoría en su lugar"
    [isLoading]="isDeleting()"
    [errorStatus]="deleteErrorStatus()"
    [errorMessage]="deleteErrorMessage()"
    [conflictMetadata]="deleteConflictMetadata()"
    (confirm)="confirmDelete()"
    (fallback)="fallbackDeactivate()"
    (cancel)="cancelDelete()"
  />
}
