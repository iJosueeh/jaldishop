<div class="flex flex-col gap-6 w-full font-sans">
  <!-- Card 1: Alertas Sonoras de Nuevos Pedidos -->
  <div class="p-5 sm:p-6 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex flex-col gap-5 shadow-2xs">
    <div class="flex items-start justify-between gap-4">
      <div class="flex items-start gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-amber-500/10 text-amber-600 flex items-center justify-center shrink-0 border border-amber-500/20">
          <ng-icon name="matVolumeUpOutline" class="text-2xl" />
        </div>
        <div class="flex flex-col">
          <h3 class="text-base font-bold text-on-surface">Sonido de Pedido en Tiempo Real</h3>
          <p class="text-xs sm:text-sm text-on-surface-variant mt-0.5">
            Emite una campana sonora en el navegador inmediatamente cuando ingresa un pedido por WebSocket.
          </p>
        </div>
      </div>

      <button
        type="button"
        role="switch"
        [attr.aria-checked]="soundAlert()"
        (click)="soundAlert.set(!soundAlert())"
        class="w-12 h-6.5 rounded-full transition-colors relative cursor-pointer shrink-0 focus:outline-hidden focus:ring-2 focus:ring-primary/30"
        [class.bg-primary]="soundAlert()"
        [class.bg-surface-container-highest]="!soundAlert()"
        aria-label="Alternar alertas sonoras de pedidos"
      >
        <span
          class="block w-5 h-5 rounded-full bg-white shadow-xs transition-transform absolute top-0.5 left-0.5"
          [class.translate-x-5.5]="soundAlert()"
          [class.translate-x-0]="!soundAlert()"
        ></span>
      </button>
    </div>

    <!-- Controles de volumen y prueba si está activo -->
    @if (soundAlert()) {
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-4 border-t border-outline-variant/20 bg-surface-container-low/60 -mx-5 sm:-mx-6 -mb-5 sm:-mb-6 p-4 sm:p-5 rounded-b-2xl">
        <div class="flex items-center gap-3 flex-1 max-w-sm">
          <ng-icon name="matVolumeMuteOutline" class="text-lg text-on-surface-variant shrink-0" />
          <input
            type="range"
            min="10"
            max="100"
            step="5"
            [ngModel]="soundVolume()"
            (ngModelChange)="soundVolume.set($event)"
            class="w-full accent-primary cursor-pointer"
            aria-label="Volumen del sonido"
          />
          <ng-icon name="matVolumeUpOutline" class="text-lg text-on-surface-variant shrink-0" />
          <span class="text-xs font-mono font-bold text-on-surface min-w-[36px]">
            {{ soundVolume() }}%
          </span>
        </div>

        <button
          type="button"
          (click)="playTestSound()"
          class="px-4 py-2 rounded-xl bg-surface-container-highest hover:bg-surface-container-high text-on-surface text-xs font-bold transition-all cursor-pointer flex items-center justify-center gap-1.5 shrink-0"
        >
          <ng-icon name="matPlayArrowOutline" class="text-base text-primary" />
          <span>Probar Sonido</span>
        </button>
      </div>
    }
  </div>

  <!-- Card 2: Alerta Visual de Inventario Bajo -->
  <div class="p-5 sm:p-6 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 flex items-start justify-between gap-4 shadow-2xs">
    <div class="flex items-start gap-3.5">
      <div class="w-10 h-10 rounded-xl bg-rose-500/10 text-rose-600 flex items-center justify-center shrink-0 border border-rose-500/20">
        <ng-icon name="matInventory2Outline" class="text-2xl" />
      </div>
      <div class="flex flex-col">
        <h3 class="text-base font-bold text-on-surface">Avisos de Stock Crítico</h3>
        <p class="text-xs sm:text-sm text-on-surface-variant mt-0.5">
          Muestra insignias visuales destacadas en el panel cuando los productos alcancen stock mínimo.
        </p>
      </div>
    </div>

    <button
      type="button"
      role="switch"
      [attr.aria-checked]="lowStockAlert()"
      (click)="lowStockAlert.set(!lowStockAlert())"
      class="w-12 h-6.5 rounded-full transition-colors relative cursor-pointer shrink-0 focus:outline-hidden focus:ring-2 focus:ring-primary/30"
      [class.bg-primary]="lowStockAlert()"
      [class.bg-surface-container-highest]="!lowStockAlert()"
      aria-label="Alternar alertas de stock crítico"
    >
      <span
        class="block w-5 h-5 rounded-full bg-white shadow-xs transition-transform absolute top-0.5 left-0.5"
        [class.translate-x-5.5]="lowStockAlert()"
        [class.translate-x-0]="!lowStockAlert()"
      ></span>
    </button>
  </div>

  <!-- Botón Guardar -->
  <div class="flex justify-end pt-2">
    <button
      type="button"
      (click)="saveAlerts()"
      [disabled]="settingsService.isSaving()"
      class="px-5 py-2.5 rounded-xl bg-primary hover:bg-primary/90 text-white text-xs font-bold transition-all shadow-xs cursor-pointer flex items-center gap-2 disabled:opacity-50"
    >
      <ng-icon name="matSaveOutline" class="text-base" />
      <span>{{ settingsService.isSaving() ? 'Guardando...' : 'Guardar Alertas' }}</span>
    </button>
  </div>
</div>
