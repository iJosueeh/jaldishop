<div class="flex flex-col flex-1 w-full gap-6 font-sans pb-10">
  <!-- Header -->
  <app-settings-header />

  <!-- Tabs Navigation (3 Pestañas Claras y Sin Bloat) -->
  <nav class="flex items-center gap-2 border-b border-outline-variant/30 overflow-x-auto pb-px no-scrollbar" role="tablist">
    <!-- Tab 1: Cobros y Despacho -->
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="currentTab() === 'payments'"
      (click)="setTab('payments')"
      class="px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 transition-all cursor-pointer flex items-center gap-2 shrink-0 duration-200"
      [class.border-primary]="currentTab() === 'payments'"
      [class.text-primary]="currentTab() === 'payments'"
      [class.border-transparent]="currentTab() !== 'payments'"
      [class.text-on-surface-variant]="currentTab() !== 'payments'"
      [class.hover:text-on-surface]="currentTab() !== 'payments'"
    >
      <ng-icon name="matPaymentsOutline" class="text-lg" />
      <span>Cobros y Despacho</span>
    </button>

    <!-- Tab 2: Políticas y Checkout -->
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="currentTab() === 'policies'"
      (click)="setTab('policies')"
      class="px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 transition-all cursor-pointer flex items-center gap-2 shrink-0 duration-200"
      [class.border-primary]="currentTab() === 'policies'"
      [class.text-primary]="currentTab() === 'policies'"
      [class.border-transparent]="currentTab() !== 'policies'"
      [class.text-on-surface-variant]="currentTab() !== 'policies'"
      [class.hover:text-on-surface]="currentTab() !== 'policies'"
    >
      <ng-icon name="matGavelOutline" class="text-lg" />
      <span>Políticas y Checkout</span>
    </button>

    <!-- Tab 3: Alertas y Sonidos -->
    <button
      type="button"
      role="tab"
      [attr.aria-selected]="currentTab() === 'alerts'"
      (click)="setTab('alerts')"
      class="px-4 py-2.5 text-xs sm:text-sm font-bold border-b-2 transition-all cursor-pointer flex items-center gap-2 shrink-0 duration-200"
      [class.border-primary]="currentTab() === 'alerts'"
      [class.text-primary]="currentTab() === 'alerts'"
      [class.border-transparent]="currentTab() !== 'alerts'"
      [class.text-on-surface-variant]="currentTab() !== 'alerts'"
      [class.hover:text-on-surface]="currentTab() !== 'alerts'"
    >
      <ng-icon name="matNotificationsOutline" class="text-lg" />
      <span>Alertas y Sonidos</span>
    </button>
  </nav>

  <!-- Tabs Content con transición fluida -->
  <main class="w-full">
    @switch (currentTab()) {
      @case ('payments') {
        <app-settings-payments-delivery-tab />
      }
      @case ('policies') {
        <app-settings-policies-tab />
      }
      @case ('alerts') {
        <app-settings-alerts-tab />
      }
    }
  </main>
</div>
