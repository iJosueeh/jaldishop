<div class="p-4 sm:p-5 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 shadow-2xs flex flex-col justify-between gap-4 font-sans h-full">
  <div class="flex items-center justify-between pb-3 border-b border-outline-variant/20">
    <div class="flex items-center gap-2">
      <span class="p-1.5 rounded-lg bg-primary/10 text-primary flex items-center justify-center">
        <ng-icon name="matGroupOutline" class="text-[18px]" />
      </span>
      <div>
        <h3 class="font-extrabold text-sm text-on-surface">Usuarios Recientes</h3>
        <p class="text-[11px] text-on-surface-variant font-medium">Últimas cuentas registradas</p>
      </div>
    </div>
    <a
      routerLink="/admin/users"
      class="text-xs font-bold text-primary hover:underline"
    >
      Ver todos &rarr;
    </a>
  </div>

  <div class="flex flex-col gap-2.5 flex-1">
    @for (user of users(); track user.id) {
      <div class="flex items-center justify-between p-2.5 rounded-xl hover:bg-surface-container transition-colors">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-8 h-8 rounded-lg bg-surface-container-high text-on-surface font-extrabold text-xs flex items-center justify-center shrink-0">
            {{ user.fullName.substring(0, 2).toUpperCase() }}
          </div>
          <div class="flex flex-col min-w-0">
            <span class="text-xs font-bold text-on-surface truncate">{{ user.fullName }}</span>
            <span class="text-[11px] text-on-surface-variant truncate">{{ user.email }}</span>
          </div>
        </div>

        <div class="flex items-center gap-2 shrink-0">
          <span
            class="px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wider"
            [class.bg-primary/10]="user.roles.includes('ADMIN')"
            [class.text-primary]="user.roles.includes('ADMIN')"
            [class.bg-secondary-container/20]="user.roles.includes('MERCHANT')"
            [class.text-secondary]="user.roles.includes('MERCHANT')"
            [class.bg-surface-container-high]="user.roles.includes('CUSTOMER')"
            [class.text-on-surface-variant]="user.roles.includes('CUSTOMER')"
          >
            {{ user.roles[0] || 'USER' }}
          </span>
          <span
            class="w-2 h-2 rounded-full"
            [class.bg-emerald-500]="user.status === 'ACTIVE'"
            [class.bg-rose-500]="user.status === 'SUSPENDED'"
            [title]="user.status"
          ></span>
        </div>
      </div>
    } @empty {
      <div class="py-6 text-center text-xs text-on-surface-variant">
        No hay usuarios registrados aún.
      </div>
    }
  </div>
</div>
