<div class="flex flex-col flex-1 w-full gap-5 sm:gap-6 font-sans">
  <!-- Encabezado del Dashboard Admin -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h1 class="text-xl sm:text-2xl font-black text-on-surface tracking-tight">
        Panel de Control Global
      </h1>
      <p class="text-xs sm:text-sm text-on-surface-variant font-medium mt-0.5">
        Supervisión transaccional en tiempo real de comercios, usuarios y gobernanza de JaldiShop
      </p>
    </div>

    <!-- Botones de Acción Ejecutiva -->
    <div class="flex items-center gap-2.5 flex-wrap self-start sm:self-auto">
      <!-- Botón Conciliación de Pagos -->
      <button
        type="button"
        (click)="openReconciliationModal()"
        class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface text-xs font-bold border border-outline-variant/30 transition-colors shadow-2xs cursor-pointer"
        title="Herramienta de Conciliación de Pagos Desfasados"
      >
        <ng-icon name="matBoltOutline" class="text-[16px] text-amber-600 dark:text-amber-400" />
        <span>Conciliación de Pagos</span>
      </button>

      <!-- Botón Exportar PDF -->
      <button
        type="button"
        (click)="exportPdf()"
        [disabled]="adminService.isExportingPdf()"
        class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-surface-container hover:bg-surface-container-high disabled:opacity-50 text-on-surface text-xs font-bold border border-outline-variant/30 transition-colors shadow-2xs cursor-pointer"
        title="Descargar reporte ejecutivo en PDF"
      >
        <ng-icon
          name="matPictureAsPdfOutline"
          class="text-[16px] text-rose-600"
          [class.animate-pulse]="adminService.isExportingPdf()"
        />
        <span>{{ adminService.isExportingPdf() ? 'Generando PDF...' : 'Exportar Reporte (PDF)' }}</span>
      </button>

      <!-- Botón de Actualizar Datos (Manual Sync Fallback) -->
      <button
        type="button"
        (click)="refreshData()"
        class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl bg-primary text-on-primary hover:bg-primary/90 text-xs font-bold transition-colors shadow-2xs cursor-pointer"
        title="Sincronizar métricas con la API"
      >
        <ng-icon
          name="matRefreshOutline"
          class="text-[16px]"
          [class.animate-spin]="adminService.isLoadingUsers() || adminService.isLoadingStores() || adminService.isLoadingAnalytics()"
        />
        <span>Sincronizar</span>
      </button>
    </div>
  </div>

  <!-- KPIs Globales de la Plataforma -->
  <app-admin-dashboard-kpis
    [metrics]="adminService.metrics()"
    [analytics]="adminService.analyticsSummary()"
  />

  <!-- Monitor de Salud & Operatividad del Sistema -->
  <app-admin-platform-health
    [metrics]="adminService.metrics()"
    [isLoading]="adminService.isLoadingStores() || adminService.isLoadingUsers()"
    (filterSuspended)="onFilterSuspendedStores()"
  />

  <!-- Paneles Secundarios: Usuarios Recientes y Tiendas -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-5">
    <app-admin-quick-users
      [users]="recentUsers()"
      (selectUser)="onSelectUser($event)"
    />
    <app-admin-quick-stores
      [stores]="recentStores()"
      (selectStore)="onSelectStore($event)"
    />
  </div>

  <!-- Ficha 360 Lateral para Usuario (Drawer) -->
  <app-admin-user-drawer
    [isOpen]="isUserDrawerOpen()"
    [user]="drawerUser()"
    (closeDrawer)="onCloseUserDrawer()"
    (statusChange)="onUserDrawerStatusChange($event)"
  />

  <!-- Ficha 360 Lateral para Tienda (Drawer) -->
  <app-admin-store-drawer
    [isOpen]="isStoreDrawerOpen()"
    [store]="drawerStore()"
    (closeDrawer)="onCloseStoreDrawer()"
    (statusChange)="onStoreDrawerStatusChange($event)"
  />

  <!-- Modal de Conciliación de Pagos -->
  <app-payment-reconciliation-modal
    [isOpen]="isReconciliationModalOpen()"
    (closeModal)="closeReconciliationModal()"
  />
</div>
