<div class="flex flex-col flex-1 w-full gap-5 sm:gap-6 font-sans">
  <!-- Encabezado -->
  <app-admin-users-header
    [totalCount]="adminService.metrics().totalUsers"
    [isLoading]="adminService.isLoadingUsers()"
    (refresh)="onRefresh()"
  />

  <!-- Barra de Filtros y Búsqueda -->
  <app-admin-users-filter-bar
    [searchQuery]="adminService.userSearchQuery()"
    [selectedRole]="adminService.userRoleFilter()"
    [selectedStatus]="adminService.userStatusFilter()"
    (searchChange)="onSearchChange($event)"
    (roleChange)="onRoleChange($event)"
    (statusChange)="onStatusChange($event)"
  />

  <!-- Tabla de Datos -->
  <app-admin-users-table
    [users]="adminService.filteredUsers()"
    (toggleStatus)="onOpenStatusModal($event)"
  />

  <!-- Modal de Suspensión / Reactivación -->
  <app-user-status-modal
    [isOpen]="isModalOpen()"
    [user]="selectedUser()"
    (confirm)="onConfirmStatusChange($event)"
    (cancel)="onCloseModal()"
  />
</div>
