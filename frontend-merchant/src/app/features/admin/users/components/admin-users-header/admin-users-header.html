<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 font-sans">
  <div>
    <div class="flex items-center gap-2">
      <h1 class="text-xl sm:text-2xl font-black text-on-surface tracking-tight">
        Directorio de Usuarios
      </h1>
      <span class="px-2.5 py-0.5 rounded-full bg-surface-container-high text-on-surface font-extrabold text-xs font-mono tabular-nums">
        {{ totalCount() }}
      </span>
    </div>
    <p class="text-xs sm:text-sm text-on-surface-variant font-medium mt-0.5">
      Administración central de cuentas, privilegios de acceso y gobernanza de administradores
    </p>
  </div>

  <div class="flex items-center gap-2.5 self-start sm:self-auto flex-wrap">
    <!-- Botón Invitar Administrador -->
    <button
      type="button"
      (click)="inviteAdmin.emit()"
      class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-primary hover:bg-primary/90 text-on-primary text-xs font-black shadow-xs transition-colors cursor-pointer"
      title="Invitar a un nuevo colaborador como administrador"
    >
      <ng-icon name="matPersonAddOutline" class="text-[16px]" />
      <span>Invitar Administrador</span>
    </button>

    <!-- Botón Refrescar -->
    <button
      type="button"
      (click)="refresh.emit()"
      class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl bg-surface-container hover:bg-surface-container-high text-on-surface text-xs font-bold border border-outline-variant/30 transition-colors shadow-2xs cursor-pointer"
      title="Sincronizar usuarios"
    >
      <ng-icon name="matRefreshOutline" class="text-[16px]" [class.animate-spin]="isLoading()" />
      <span>Actualizar</span>
    </button>
  </div>
</div>
