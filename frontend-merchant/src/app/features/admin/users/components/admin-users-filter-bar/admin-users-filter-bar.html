<div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 p-3 sm:p-4 rounded-2xl bg-surface-container-lowest border border-outline-variant/30 shadow-2xs font-sans">
  <!-- Buscador en tiempo real -->
  <div class="relative flex-1 min-w-0">
    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
      <ng-icon name="matSearchOutline" class="text-[18px]" />
    </span>
    <input
      type="text"
      [value]="searchQuery()"
      (input)="onSearchInput($event)"
      placeholder="Buscar por nombre, correo, teléfono o tienda..."
      class="w-full pl-9 pr-8 py-2 text-xs font-medium rounded-xl bg-surface border border-outline-variant/30 focus:border-primary focus:outline-hidden text-on-surface placeholder:text-on-surface-variant transition-colors"
    />
    @if (searchQuery()) {
      <button
        type="button"
        (click)="clearSearch()"
        class="absolute inset-y-0 right-0 pr-2.5 flex items-center text-on-surface-variant hover:text-on-surface"
        aria-label="Limpiar búsqueda"
      >
        <ng-icon name="matCloseOutline" class="text-[16px]" />
      </button>
    }
  </div>

  <!-- Pills de Rol & Filtro de Estado -->
  <div class="flex items-center gap-2 overflow-x-auto pb-1 md:pb-0">
    <!-- Pills de Rol -->
    <div class="flex items-center gap-1 bg-surface-container/60 p-1 rounded-xl border border-outline-variant/20 shrink-0">
      <button
        type="button"
        (click)="roleChange.emit('ALL')"
        class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all"
        [class.bg-surface-container-lowest]="selectedRole() === 'ALL'"
        [class.text-on-surface]="selectedRole() === 'ALL'"
        [class.shadow-2xs]="selectedRole() === 'ALL'"
        [class.text-on-surface-variant]="selectedRole() !== 'ALL'"
      >
        Todos
      </button>

      <button
        type="button"
        (click)="roleChange.emit('ADMIN')"
        class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all"
        [class.bg-surface-container-lowest]="selectedRole() === 'ADMIN'"
        [class.text-primary]="selectedRole() === 'ADMIN'"
        [class.shadow-2xs]="selectedRole() === 'ADMIN'"
        [class.text-on-surface-variant]="selectedRole() !== 'ADMIN'"
      >
        Admin
      </button>

      <button
        type="button"
        (click)="roleChange.emit('MERCHANT')"
        class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all"
        [class.bg-surface-container-lowest]="selectedRole() === 'MERCHANT'"
        [class.text-secondary]="selectedRole() === 'MERCHANT'"
        [class.shadow-2xs]="selectedRole() === 'MERCHANT'"
        [class.text-on-surface-variant]="selectedRole() !== 'MERCHANT'"
      >
        Merchant
      </button>

      <button
        type="button"
        (click)="roleChange.emit('CUSTOMER')"
        class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all"
        [class.bg-surface-container-lowest]="selectedRole() === 'CUSTOMER'"
        [class.text-on-surface]="selectedRole() === 'CUSTOMER'"
        [class.shadow-2xs]="selectedRole() === 'CUSTOMER'"
        [class.text-on-surface-variant]="selectedRole() !== 'CUSTOMER'"
      >
        Cliente
      </button>
    </div>

    <!-- Filtro de Estado -->
    <select
      [value]="selectedStatus()"
      (change)="onStatusChange($event)"
      class="py-1.5 px-3 rounded-xl bg-surface border border-outline-variant/30 text-xs font-bold text-on-surface focus:outline-hidden cursor-pointer shrink-0"
    >
      <option value="ALL">Todos los estados</option>
      <option value="ACTIVE">Activos</option>
      <option value="SUSPENDED">Suspendidos</option>
    </select>
  </div>
</div>
